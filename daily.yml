name: 每日生成计划并部署

on:
  schedule:
    # 每天 UTC 16:30 = 北京时间 00:30
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成今日计划
        run: python agent/generate_daily.py

      - name: 配置 Pages 基础路径
        run: |
          REPO="${{ github.event.repository.name }}"
          python scripts/set_base.py "$REPO"

      - name: 构建静态站点
        run: python scripts/build_site.py

      - name: 提交生成的计划文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plans/ || true
          git diff --cached --quiet || git commit -m "chore: 更新 $(date +%Y-%m-%d) 计划"
          git push || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
